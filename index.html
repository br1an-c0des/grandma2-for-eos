<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>grandMA2 for Eos Programmers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">
    <span class="theme-icon"></span>
  </button>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="#" class="sidebar-title" id="homeLink">
        <span class="ma2">gMA2</span> for <span class="eos">Eos</span>
      </a>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search..." aria-label="Search guide content">
    </div>
    <ul class="toc-list" id="tocList"></ul>
  </nav>

  <button class="menu-toggle" id="menuToggle" aria-label="Toggle table of contents">&#9776;</button>

  <main class="content" id="content">
    <!-- Hero / landing page -->
    <div class="page" id="page-home">
      <header class="hero">
        <h1><span class="ma2">grandMA2</span> for <span class="eos">Eos</span> Programmers</h1>
        <p class="subtitle">and vice versa</p>
        <p class="tagline">A guide for whether you're in a pinch or just want to learn&hellip;</p>
        <p class="author">By Brian Abbott</p>
        <p class="version">version 1.0.1 &bull; May 2018</p>
      </header>
      <div class="home-nav" id="homeNav"></div>
    </div>

    <!-- Section pages get injected here -->
    <div id="pages"></div>

    <!-- Search results overlay -->
    <div class="page" id="page-search" hidden>
      <h2 class="page-title">Search Results</h2>
      <div id="searchResultsList"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
